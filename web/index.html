<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORVIO</title>
<link rel="icon" href="data:,">
<style>
/* 글꼴은 함께 넣은 파일만 쓴다 (NFR-06: 인터넷 없이). Pretendard 1.3.9 가변 글꼴, SIL OFL 1.1 (fonts/LICENSE.txt) */
@font-face{font-family:Pretendard;src:url(fonts/PretendardVariable.woff2) format('woff2-variations'),url(fonts/PretendardVariable.woff2) format('woff2');font-weight:45 920;font-style:normal;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
body{font-family:Pretendard,system-ui,sans-serif}

/* 무대: 1920×1080 을 화면에 맞춰 통째로 줄이고 늘린다(fit). tvWrap 은 늘 무대와 같은 크기·자리 */
.tv-wrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
.tv { width: 1920px; height: 1080px; transform-origin: 0 0; position: absolute; top: 0; left: 0; }

/* ---------- 토큰: achromatic ledger + 사용자 취향(무채색 + 보라 하나). 라이트 / 다크 ---------- */
.tv{--accent:#8a5cf5;--ease-out:cubic-bezier(.22,1,.36,1);--ease-expo:cubic-bezier(.16,1,.3,1);--ease-io:cubic-bezier(.76,0,.24,1);--turn:380ms;
  --hole:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAxMDAgMTAwJz48cGF0aCBmaWxsLXJ1bGU9J2V2ZW5vZGQnIGQ9J001MCAwYTUwIDUwIDAgMSAxIDAgMTAwYTUwIDUwIDAgMSAxIDAtMTAwek01MCA0My43NWE2LjI1IDYuMjUgMCAxIDAgMCAxMi41YTYuMjUgNi4yNSAwIDEgMCAwLTEyLjV6Jy8+PC9zdmc+");
  --ground:#f3f3f3;--ink:#262626;--muted:#5c5c5c;--card:#e4e4e4;--surface:#f3f3f3;--panel:#ececec;--pill:#e2e2e2;--pill2:#d6d6d6;
  --primary:#1d1f20;--on-primary:#f3f3f3;--pri-kc:#3a3c3d;
  --disc:#dedede;--knurl:#c9c9c9;--plate:#d3d3d3;--ring-ink:#404040;--tick:#a3a3a3;--hover-cl:#c6c6c6;
  --line:#b8b8b8;--line2:#8a8a8a;--kc:#dcdcdc;--dpad0:#c2c2c2;--key:#e3e3e3;--field:#e6e6e6;--ph:#5a5a5a;--rowf:#e4e4e4;--mif:#dedede;
  --track:#d2d2d2;--conn:#dfdfdf;--btn2:#dadada;--sysface:#d6d6d6;--spin0:#cfcfcf;
  --scrim:rgba(38,38,38,.42);--toast:#262626;--toast-ink:#f3f3f3;--tipbg:#4a4a4a;--hub:rgba(243,243,243,.42);--edge:rgba(0,0,0,.22);
  background:var(--ground);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
.tv[data-theme="dark"]{--ground:#262626;--ink:#e8e8e8;--muted:#a8a8a8;--card:#333333;--surface:#3d3d3d;--panel:#303030;--pill:#3a3a3a;--pill2:#444444;
  --primary:#e3e3e3;--on-primary:#1e1e1e;--pri-kc:#c4c4c4;
  --disc:#2f2f2f;--knurl:#3d3d3d;--plate:#353535;--ring-ink:#c4c4c4;--tick:#5a5a5a;--hover-cl:#474747;
  --line:#5a5a5a;--line2:#8a8a8a;--kc:#3d3d3d;--dpad0:#555555;--key:#333333;--field:#303030;--ph:#9a9a9a;--rowf:#333333;--mif:#3a3a3a;
  --track:#444444;--conn:#3a3a3a;--btn2:#3a3a3a;--sysface:#3c3c3c;--spin0:#4a4a4a;
  --scrim:rgba(20,20,20,.35);--toast:#3c3c3c;--toast-ink:#e8e8e8;--tipbg:#4a4a4a;--hub:rgba(255,255,255,.16);--edge:rgba(255,255,255,.22)}
.tv.theming,.tv.theming *{transition:background-color 260ms ease,color 260ms ease,fill 260ms ease,stroke 260ms ease,outline-color 260ms ease,border-color 260ms ease!important} /* 테마를 바꿀 때만 짧게 */
/* 홈 배경(명세 4.4, FR-29): 3시 게임 표지를 흐리고 어둡게 깐 맨 아래 층. 무대보다 사방 80px 크게 깔아 흐림의 가장자리가 안 보이게. 다크는 사진 세기 80 */
.tv{isolation:isolate;--po:.616;--pb:1}
.tv[data-theme="dark"]{--po:.616;--pb:.884}
.bgp{position:absolute;inset:-80px;z-index:-1;pointer-events:none;background-size:cover;background-position:center;filter:blur(40px) saturate(.8) brightness(var(--pb));opacity:0;visibility:hidden;transition:opacity 600ms ease,visibility 0s 600ms} /* 꺼진 층은 다 사라진 뒤 그리기에서 뺀다 */
.bgp.on{opacity:var(--po);visibility:visible;transition-delay:0s}
.tv.theming .bgp{transition:opacity 260ms ease!important} /* 위 규칙이 opacity 전환을 덮어 사진 농도가 튀지 않게 */
.tv.nocursor,.tv.nocursor *{cursor:none!important}
.tv.paused *{animation-play-state:paused!important} /* 홈이 숨어 있는 동안 그리기 멈춤 (NFR-05) */
.tv svg.ic{width:1em;height:1em;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- CD: 표지가 면 전체, 가운데 구멍(12.5%)은 마스크로 실제로 뚫고, 허브 고리(30%)는 반투명 ---------- */
.cdw{position:relative;border-radius:50%;flex:none}
.face{position:absolute;inset:0;border-radius:50%;overflow:hidden;background-size:cover;background-position:center;display:grid;justify-items:center;align-items:start;
  -webkit-mask:var(--hole) center/100% 100% no-repeat;mask:var(--hole) center/100% 100% no-repeat}
.face svg.mo{position:absolute;inset:0;width:100%;height:100%}
.face::before{content:"";position:absolute;left:35%;top:35%;width:30%;height:30%;box-sizing:border-box;border-radius:50%;background:var(--hub);border:1px solid var(--edge)}
.face::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--edge)}
.face.svc{background:var(--c);color:var(--i)}
.tv[data-theme="dark"] .face.svc{background:var(--cd);color:var(--id)}
.face .lt{position:relative;margin-top:10%;font-size:1em;line-height:1;font-weight:700;display:grid;place-items:center}

/* ---------- 원판 (중심 x=-350, y=540, 반지름 760) ---------- */
.dial{position:absolute;left:-350px;top:540px;width:0;height:0}
.spin{position:absolute;left:0;top:0;transition:transform 900ms var(--ease-expo),opacity 500ms ease}
.disc{position:absolute;left:-800px;top:-800px;width:1600px;height:1600px;transition:transform var(--turn) var(--ease-out)}
.disc .d0{fill:var(--disc);stroke:var(--line2);stroke-width:3} .disc .d1{stroke:var(--knurl)} .disc .d2{fill:var(--plate)}
.cats,.items{position:absolute;left:0;top:0}
.cats{transition:transform var(--turn) var(--ease-out)}
.items{transition:transform 420ms var(--ease-out),opacity 300ms ease}
/* 처음 켤 때 회전: 목록이 온 그때 한 번 CD 고리가 -64°에서 돌아 들어온다. 그 전(SCR-09)에는 원판과 분류 링만 보인다 */
.tv.boot .items{transform:rotate(-64deg);opacity:0;transition:none}
.tv.booting .items{transition:transform 900ms var(--ease-expo),opacity 500ms ease}
.spoke{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;transition:transform var(--turn) var(--ease-out),opacity var(--turn) ease}
.spoke.hid{pointer-events:none}
.tv.idle .spoke,.tv.idle .disc,.tv.idle .it .rd{transition-duration:1100ms;transition-timing-function:var(--ease-io)}

.it{position:absolute;left:680px;top:-80px;width:640px;height:160px;transform-origin:80px 80px;transition:transform var(--turn) var(--ease-out);pointer-events:none}
.spoke:not(.hid) .it .rd,.spoke.nb:not(.far):not(.hid) .it .cd{pointer-events:auto;cursor:pointer} /* 상자는 보이지 않으니 판정은 원(둥근 모서리)과 보이는 카드에만 */
.it .rd{position:absolute;left:-140px;top:-140px;width:440px;height:440px;z-index:1;font-size:100px;transform:scale(.3636);outline:0 solid transparent;outline-offset:12px;
  transition:transform var(--turn) var(--ease-out),outline-color 160ms ease}
.spoke.c .rd{transform:translateX(180px) scale(.92);outline:3px solid var(--line)} /* 3시 자리: 원판에서 반쯤 빠져나온 판. 포커스가 링·버튼에 있으면 조금 작고 회색 테두리 */
.spoke.c .it.focus .rd{transform:translateX(180px);outline:0 solid transparent}
/* 포커스 CD 테두리: 표지 위로 8px 겹치는 아크릴 고리(11-09 결정). 빛과 입자는 ring-acrylic.svg */
.spoke.c .it.focus .rd::before,.spoke.c .it.focus .rd::after{content:"";position:absolute;inset:-10px;border-radius:50%;pointer-events:none}
.spoke.c .it.focus .rd::before{z-index:1;background:radial-gradient(circle closest-side,transparent calc(100% - 32px),rgba(0,0,0,.34) calc(100% - 18px),transparent calc(100% - 17.9px));box-shadow:0 0 0 2px rgba(0,0,0,.62),0 12px 24px rgba(0,0,0,.34),0 3px 6px rgba(0,0,0,.26)}
.spoke.c .it.focus .rd::after{z-index:2;padding:18px;backdrop-filter:blur(10px) brightness(1.18) saturate(1.2);background:url(ring-acrylic.svg) center/100% 100% no-repeat;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}.it .cd{position:absolute;left:80px;top:14px;width:560px;height:132px;box-sizing:border-box;border-radius:8px;background:var(--card);padding:14px 26px 0 104px;transition:background 180ms ease,opacity var(--turn) ease}
.spoke.c .cd,.spoke.far .cd{opacity:0;pointer-events:none} /* 가운데는 판만, 두 칸 넘게 떨어지면 판만 */
.it .tt{font-size:36px;font-weight:600;line-height:46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.it .mt{font-size:28px;line-height:40px;color:var(--muted);margin-top:4px;display:flex;gap:12px;align-items:center;white-space:nowrap;overflow:hidden}
.tv:not(.nocursor) .spoke.nb:hover .cd{background:var(--surface);outline:3px solid var(--line2)}
.tv:not(.nocursor) .spoke.far:not(.hid):hover .rd{outline:8px solid var(--line2)}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:6px;background:var(--pill);color:var(--ink);font-size:24px;white-space:nowrap}
.it .chip{background:var(--pill2);font-size:28px;height:40px}

/* '처음' 눈금: 마지막 항목과 첫 항목 사이 */
.fm{position:absolute;left:686px;top:-2px;width:158px;height:4px;border-radius:2px;background:var(--ink)}
.fm b{position:absolute;left:174px;top:-16px;font-size:26px;line-height:36px;font-weight:600;white-space:nowrap}

/* 안쪽 링: 분류 */
.cl{position:absolute;left:300px;top:-24px;width:336px;height:48px;text-align:right;font-size:26px;line-height:48px;color:var(--ring-ink);white-space:nowrap;cursor:pointer}
.cl span{display:inline-block;line-height:40px;padding:0 10px;border-radius:6px;transform-origin:100% 50%;transition:transform 160ms var(--ease-out)}
.cl.on{color:var(--ink);font-size:30px;font-weight:600}
.cl.focus span{background:var(--ink);color:var(--ground);outline:4px solid var(--accent);transform:scale(1.1)}
.tv:not(.nocursor) .cl:not(.focus):hover span{background:var(--hover-cl)}
.ctk{position:absolute;left:650px;top:-2px;width:14px;height:4px;background:var(--tick)}
.ptr{position:absolute;left:648px;top:-11px;width:0;height:0;border:11px solid transparent;border-left:16px solid var(--accent);border-right:0}
.cnt{position:absolute;left:300px;top:30px;width:326px;text-align:right;font-size:24px;line-height:32px;color:var(--ring-ink);transition:opacity 160ms ease}
.cnt.swap{opacity:0;transition:none}

/* ---------- 위 줄 ---------- */
.bar{position:absolute;left:900px;top:54px;width:924px;height:56px;display:flex;align-items:center;justify-content:flex-end;gap:24px;font-size:24px}
.st{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.st svg.ic{font-size:30px}
.okdot{width:10px;height:10px;border-radius:50%;background:var(--ink);display:inline-block}
.clock{font-size:28px;font-weight:600}
.ib{width:52px;height:52px;border-radius:6px;display:inline-grid;place-items:center;font-size:30px;color:var(--ink);cursor:pointer;transition:background 180ms ease}
.ib:hover{background:var(--pill)}
.bar .clock{margin-right:4px}

/* ---------- 오른쪽 상세: 사진 없이 글자만 (사진은 원판의 판 한 곳) ---------- */
.detail{position:absolute;left:900px;top:322px;width:924px}
.dt{font-size:64px;line-height:76px;font-weight:700;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm{font-size:28px;line-height:38px;color:var(--muted);margin-top:10px}
.dc{display:flex;gap:12px;margin-top:18px;min-height:36px}
.dr{font-size:32px;line-height:44px;font-weight:500;margin:24px 0 0}
.acts{display:flex;gap:16px;margin-top:34px}
.btn{height:76px;padding:0 30px;border-radius:6px;box-sizing:border-box;background:var(--pill);color:var(--ink);font-size:28px;font-weight:600;display:inline-flex;align-items:center;gap:14px;white-space:nowrap;cursor:pointer;transition:transform 160ms var(--ease-out)}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn.focus{outline:4px solid var(--accent);outline-offset:4px;transform:scale(1.04)}
.btn:active{transform:scale(.97)}
.dn{font-size:24px;line-height:34px;color:var(--muted);margin:20px 0 0}
/* SCR-09 불러오는 중: 상세 자리에 ORVIO 마크(잉크 단색) + 실행 중 화면의 상태 글 */
#dRun{position:absolute;left:0;bottom:100%;margin:0 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%} /* '게임 실행 중 · (게임 이름)': 상세 위 한 줄, 메타 줄 글자 그대로 */
#loadNote{display:none}
.tv.loading #loadNote{display:block}
.tv.loading .detail>:not(#loadNote){display:none}
.mk{color:var(--ink)}
.mk svg{display:block;width:132px;height:auto}

/* ---------- 조작 안내 줄 ---------- */
.guide{position:absolute;right:96px;bottom:54px;height:44px;display:flex;align-items:center;gap:28px;font-size:24px;z-index:90;white-space:nowrap}
/* 왼쪽 아래 ORVIO 글자(명세 4.5): 안내 줄과 같은 높이, 흐린 회색 단색. x 840: 패드 안내가 가장 길 때('B 처음으로', 왼쪽 끝 x 987)도 30px 띄운다. 키보드 안내처럼 더 길어져 닿으면 숨긴다(.off) */
#brandW{position:absolute;left:840px;bottom:54px;height:44px;display:flex;align-items:center;color:var(--muted);pointer-events:none}
#brandW svg{display:block;height:16px;width:117px}
#brandW.off{visibility:hidden}
.tv.loading #brandW{display:none} /* 불러오는 중에는 상세 자리에 큰 마크가 있다 */
.h{display:inline-flex;align-items:center;gap:10px}
.h>span{display:inline-flex;gap:6px}
.gb{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--ground);display:inline-grid;place-items:center;font-size:24px;font-weight:700;flex:none}
.gb svg.ic{font-size:24px}
.gs{height:40px;padding:0 10px;border-radius:20px;background:var(--ink);color:var(--ground);font-size:24px;font-weight:700;display:inline-grid;place-items:center}
.gd svg{width:40px;height:40px;display:block}
.kc{min-width:40px;height:40px;padding:0 10px;box-sizing:border-box;border-radius:6px;background:var(--kc);color:var(--ink);font-size:24px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.kc svg.ic{font-size:22px}
.btn.pri .gb{background:var(--on-primary);color:var(--primary)}
.btn.pri .kc{background:var(--pri-kc);color:var(--on-primary)}
.btn .gb{width:44px;height:44px}
.guide .idle-note{color:var(--ink)}

/* ---------- 열린 창 ---------- */
.ov{position:absolute;inset:0;display:none;z-index:50}
.ov.open{display:block;animation:ovIn 240ms var(--ease-out)}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.ov.full{background:var(--ground)}
.ov.dim{background:var(--scrim)}
.bigslot{position:absolute;left:250px;top:300px}
.bigcd{width:440px;height:440px;font-size:100px}
.side{position:absolute;left:820px;top:330px;width:1004px}
.lt2{font-size:56px;line-height:66px;font-weight:700;margin:0;letter-spacing:-.02em}
.lmsg{display:flex;align-items:center;gap:16px;font-size:30px;margin-top:22px}
.spinr{width:30px;height:30px;border-radius:50%;border:4px solid var(--spin0);border-top-color:var(--ink);animation:sp 900ms linear infinite;box-sizing:border-box}
@keyframes sp{to{transform:rotate(360deg)}}
.lp{font-size:26px;line-height:38px;color:var(--muted);margin:18px 0 0}
.wh{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:14px}
.wh li{display:flex;align-items:center;gap:16px;font-size:26px;line-height:44px}
.wh .wg{display:inline-flex;gap:6px;min-width:110px;justify-content:flex-end}
.wh .wl{color:var(--muted);font-size:24px}
.ov h3{font-size:30px;font-weight:600;margin:40px 0 0}

.dlg{position:absolute;left:480px;top:210px;width:960px;box-sizing:border-box;padding:52px 56px;border-radius:8px;background:var(--panel);box-shadow:0 24px 60px rgba(0,0,0,.18)}
.dlg h2{font-size:44px;line-height:56px;margin:0;font-weight:700;letter-spacing:-.02em}
.kg{display:flex;align-items:center;gap:24px;margin-top:32px}
.kg b{display:block;font-size:34px;line-height:44px}
.kg span{display:block;font-size:24px;line-height:34px;color:var(--muted);margin-top:4px}
.conn{display:flex;gap:16px;margin-top:30px}
.conn div{flex:1;display:flex;align-items:center;gap:14px;height:72px;padding:0 22px;border-radius:6px;background:var(--conn);font-size:26px}
.dlg .acts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dlg .btn{justify-content:center}
.dlg .btn:not(.pri){background:var(--btn2)}
.conn div svg.ic{font-size:32px}
.conn .ok{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-weight:600}

.sq{position:absolute;left:96px;top:72px;width:1728px;height:100px;box-sizing:border-box;display:flex;align-items:center;gap:20px;padding:0 32px;border-radius:8px;background:var(--field);font-size:44px}
.sq svg.ic{font-size:44px;color:var(--muted)}
.sq input{flex:1;border:0;background:transparent;font:inherit;font-size:44px;color:var(--ink);outline:none;caret-color:var(--accent)}
.sq input::placeholder{color:var(--ph)}
.kb{position:absolute;left:96px;top:226px;display:grid;gap:10px}
.kr{display:flex;gap:10px}
.kr.gap{margin-top:14px}
.key{width:84px;height:76px;border-radius:6px;background:var(--key);display:grid;place-items:center;font-size:30px;font-weight:600;cursor:pointer}
.key.w2{width:178px;font-size:24px}
.key.focus{background:var(--surface);outline:4px solid var(--accent);transform:scale(1.06)}
.res{position:absolute;left:1090px;top:226px;width:734px;height:740px}
.res h3{font-size:26px;font-weight:600;margin:0 0 14px;color:var(--muted)}
.rl{height:690px;overflow:hidden;position:relative;box-sizing:border-box;padding:8px 18px;margin:0 -18px}
.ri{display:flex;align-items:center;gap:20px;height:96px;padding:0 18px;border-radius:8px;box-sizing:border-box;cursor:pointer}
.ri{transition:transform 160ms var(--ease-out)}
.ri.focus{background:var(--rowf);outline:4px solid var(--accent);outline-offset:2px;transform:scale(1.02)}
.ri .rc{width:68px;height:68px;font-size:22px}
.ri .rc .face .lt{margin-top:3%}
.ri .rc .face::after{border-width:1.5px}
.ri .rt{min-width:0}
.ri .rt b{display:block;font-size:30px;line-height:40px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri span{display:flex;align-items:center;gap:10px;font-size:24px;line-height:32px;color:var(--muted);white-space:nowrap}
.ri .chip{height:34px;font-size:24px}

.sheet{position:absolute;right:0;top:0;width:700px;height:1080px;box-sizing:border-box;padding:54px 96px 0 56px;background:var(--panel);box-shadow:-20px 0 60px rgba(0,0,0,.16)}
.who{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:600;height:64px}
#whoMk svg{display:block;height:34px;width:auto;flex:none} /* 빠른 메뉴 머리 ORVIO 마크(명세 4.5). 그림은 불러오는 중 화면의 것을 그대로 */
.who .clock{margin-left:auto}
.mi{display:flex;align-items:center;gap:18px;height:72px;padding:0 20px;margin:0 -20px;border-radius:6px;font-size:28px;cursor:pointer}
.mi svg.ic{font-size:32px}
.mi{transition:transform 160ms var(--ease-out)}
.mi.focus{background:var(--mif);outline:4px solid var(--accent);outline-offset:2px;transform:scale(1.02)}
.vol{margin-top:22px}
.vbar{flex:1;height:10px;border-radius:5px;background:var(--track);position:relative;margin-left:8px}
.vbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink)}
.vv{width:56px;text-align:right}
.seg{margin-left:auto;display:inline-flex;gap:4px;padding:4px;border-radius:8px;background:var(--track)}
.seg i{font-style:normal;font-size:24px;line-height:44px;padding:0 16px;border-radius:6px}
.seg i.on{background:var(--ink);color:var(--ground);font-weight:600}
.sheet h3{font-size:24px;font-weight:600;color:var(--muted);margin:26px 0 6px}
.dev{display:flex;align-items:center;gap:16px;height:56px;font-size:26px}
.dev svg.ic{font-size:32px}
.dev .r{margin-left:auto;display:inline-flex;align-items:center;gap:12px}
.bbar{width:90px;height:10px;border-radius:5px;background:var(--track);position:relative}
.bbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink)}
.sep{height:22px}

.tip{position:absolute;z-index:95;padding:10px 18px;border-radius:12px;background:var(--tipbg);color:#f3f3f3;font-size:24px;line-height:32px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 150ms ease}
.tip.on{opacity:1}
.tip::before{content:"";position:absolute;left:var(--ax,50%);top:-9px;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:var(--tipbg)}
.toast{position:absolute;left:50%;top:150px;transform:translate(-50%,-12px);z-index:96;padding:18px 30px;border-radius:8px;background:var(--toast);color:var(--toast-ink);font-size:28px;opacity:0;pointer-events:none;transition:opacity 200ms ease,transform 240ms var(--ease-out)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  .tv *,.tv *::before,.tv *::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="tv-wrap" id="tvWrap"><div class="tv boot loading" id="tv">
  <div class="bgp" aria-hidden="true"></div><div class="bgp" aria-hidden="true"></div><div class="bgp" aria-hidden="true"></div>

  <div class="dial" id="dial"><div class="spin">
    <svg class="disc" id="disc" viewBox="-800 -800 1600 1600" aria-hidden="true">
      <circle class="d0" r="760"/>
      <circle class="d1" r="748" fill="none" stroke-width="20" stroke-dasharray="3 23.11"/>
      <circle class="d2" r="668"/>
    </svg>
    <div class="cats" id="cats"></div>
    <div class="ptr"></div>
    <div class="cnt num" id="cnt"></div>
    <div class="items" id="items"></div>
  </div></div>

  <div class="bar" id="bar"></div>

  <section class="detail">
    <p class="dm" id="dRun" role="status"></p>
    <div id="loadNote">
      <div class="mk"><svg viewBox="18.9 43.8 262.5 214.7" role="img" aria-label="ORVIO"><g transform="translate(-707 -236)"><path fill="currentColor" fill-rule="evenodd" d="M929.74 341.46A109.53 101.55 0 0 1 760.73 467.32L792.75 435.30A64.40 56.42 0 0 0 896.35 374.85ZM741.59 445.45A109.53 101.55 0 0 1 910.81 319.38L878.83 351.36A64.40 56.42 0 0 0 774.82 412.21ZM943.20 302.40a22.6 22.6 0 1 0 45.2 0a22.6 22.6 0 1 0 -45.2 0Z"/></g></svg></div>
      <div class="lmsg"><span class="spinr"></span><span>게임 목록을 불러오는 중…</span></div>
    </div>
    <h1 class="dt" id="dT"></h1>
    <div class="dm" id="dM"></div>
    <div class="dc" id="dC"></div>
    <p class="dr" id="dR"></p>
    <div class="acts" id="acts">
      <div class="btn pri" data-f data-g="act" data-act="play"><span data-gl="ok"></span><span id="bPlayL">플레이</span></div>
    </div>
    <p class="dn" id="dN"></p>
  </section>

  <div class="guide" id="guide"></div>
  <div id="brandW" aria-hidden="true"><svg viewBox="557.4 549.6 561.6 76.8"><path fill="currentColor" fill-rule="evenodd" d="M601.40 549.60H612.60C636.89 549.60 656.60 566.29 656.60 586.85V589.15C656.60 609.71 636.89 626.40 612.60 626.40H601.40C577.11 626.40 557.40 609.71 557.40 589.15V586.85C557.40 566.29 577.11 549.60 601.40 549.60ZM602.00 565.15H612.00C627.35 565.15 639.80 574.58 639.80 586.20V590.20C639.80 601.82 627.35 611.25 612.00 611.25H602.00C586.65 611.25 574.20 601.82 574.20 590.20V586.20C574.20 574.58 586.65 565.15 602.00 565.15ZM702.7 552.0H771.4A24.25 24.25 0 0 1 772.6 600.5L795.6 622.0Q796.0 624.0 794.0 624.0H776.0Q774.6 624.0 773.5 623.0L746.5 600.3H734.0Q730.9 600.3 730.9 597.2V589.2Q730.9 586.0 734.0 586.0H770.4A9.5 9.5 0 0 0 770.4 567.0H702.7Q701.2 567.0 701.2 565.5V553.5Q701.2 552.0 702.7 552.0ZM703.10 581.20H715.60Q717.40 581.20 717.40 583.00V622.20Q717.40 624.00 715.60 624.00H703.10Q701.30 624.00 701.30 622.20V583.00Q701.30 581.20 703.10 581.20ZM828.0 552.0H844.5L877.4 606.6L910.5 552.0H926.8Q928.2 552.0 927.4 553.4L888.5 619.0Q877.2 629.6 865.8 619.0L827.4 553.4Q826.6 552.0 828.0 552.0ZM964.60 552.00H977.60Q979.20 552.00 979.20 553.60V622.40Q979.20 624.00 977.60 624.00H964.60Q963.00 624.00 963.00 622.40V553.60Q963.00 552.00 964.60 552.00ZM1063.80 549.60H1075.00C1099.29 549.60 1119.00 566.29 1119.00 586.85V589.15C1119.00 609.71 1099.29 626.40 1075.00 626.40H1063.80C1039.51 626.40 1019.80 609.71 1019.80 589.15V586.85C1019.80 566.29 1039.51 549.60 1063.80 549.60ZM1064.40 565.15H1074.40C1089.75 565.15 1102.20 574.58 1102.20 586.20V590.20C1102.20 601.82 1089.75 611.25 1074.40 611.25H1064.40C1049.05 611.25 1036.60 601.82 1036.60 590.20V586.20C1036.60 574.58 1049.05 565.15 1064.40 565.15Z"/></svg></div>

  <!-- 실행 중 (SCR-03) · 실행 실패 (SCR-11: 같은 자리에서 글과 버튼만 바뀜) -->
  <div class="ov full" id="ovLaunch">
    <div class="bigslot" id="launchCov"></div>
    <div class="side">
      <h2 class="lt2" id="launchT"></h2>
      <div class="lmsg"><span class="spinr" id="launchSpin"></span><span id="launchMsg"></span></div>
      <p class="lp" id="launchP"></p>
      <div class="acts" id="launchActs"></div>
    </div>
  </div>

  <!-- 키보드·마우스 확인 -->
  <div class="ov dim" id="ovKbm" data-close>
    <div class="dlg">
      <h2>키보드·마우스가 필요한 게임이에요</h2>
      <div class="kg" id="kbmGame"></div>
      <div class="conn" id="kbmConn"></div>
      <div class="acts"><div class="btn pri" data-f data-g="dlg" data-act="run"><span data-gl="ok"></span>실행</div><div class="btn" data-f data-g="dlg" data-act="close"><span data-gl="back"></span>취소</div></div>
    </div>
  </div>

  <!-- 웹 -->
  <div class="ov full" id="ovWeb">
    <div class="bigslot" id="webCov"></div>
    <div class="side" style="top:150px">
      <h2 class="lt2" id="webT"></h2>
      <div class="lmsg"><span class="spinr"></span><span>브라우저를 전체화면으로 여는 중</span></div>
      <h3>컨트롤러로 웹 쓰는 법</h3>
      <ul class="wh" id="webHelp"></ul>
      <div class="acts"><div class="btn" data-f data-g="dlg" data-act="close"><span data-gl="back"></span>홈으로 돌아가기</div></div>
    </div>
  </div>

  <!-- 검색 -->
  <div class="ov full" id="ovSearch">
    <div class="sq"><span data-ic="search"></span><input id="q" autocomplete="off" spellcheck="false" placeholder="게임이나 사이트 이름 · 초성만 쳐도 돼요 (ㅇㄹ → 엘든 링)"></div>
    <div class="kb" id="kb"></div>
    <div class="res"><h3 id="resH"></h3><div class="rl" id="resList"></div></div>
  </div>

  <!-- 빠른 메뉴 -->
  <div class="ov dim" id="ovMenu" data-close>
    <aside class="sheet">
      <div class="who"><span id="whoMk"></span><span id="qmUser"></span><span class="clock num" id="qmTime"></span></div>
      <div class="mi vol" id="vol" data-f data-g="menu" data-act="vol"><span data-ic="vol"></span>볼륨<span class="vbar" id="vbar"><i id="volBar"></i></span><span class="vv num" id="volV"></span></div>
      <div class="mi" id="thm" data-f data-g="menu" data-act="thm"><span data-ic="half"></span>화면 테마<span class="seg" id="seg"><i data-t="light">라이트</i><i data-t="dark">다크</i><i data-t="auto">자동</i></span></div>
      <div class="mi" id="idl" data-f data-g="menu" data-act="idl"><span data-ic="dialic"></span>대기 중 원판 돌리기<span class="seg" id="idlSeg"><i data-v="off">끔</i><i data-v="on">켬</i></span></div>
      <h3>연결된 기기</h3>
      <div id="qmDev"></div>
      <div class="sep"></div>
      <div class="mi" data-f data-g="menu" data-act="sys" data-p="screenOff"><span data-ic="screen"></span>화면 끄기</div>
      <div class="mi" data-f data-g="menu" data-act="sys" data-p="sleep"><span data-ic="moon"></span>절전</div>
      <div class="mi" data-f data-g="menu" data-act="sys" data-p="restart"><span data-ic="restart"></span>다시 시작</div>
      <div class="mi" data-f data-g="menu" data-act="sys" data-p="shutdown"><span data-ic="power"></span>시스템 종료</div>
      <div class="mi" data-f data-g="menu" data-act="sys" data-p="desktop"><span data-ic="desk"></span>윈도우 바탕화면으로</div>
    </aside>
  </div>

  <div class="tip" id="tip"></div>
  <div class="toast" id="toast" role="status"></div>
</div></div>
